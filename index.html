<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Credit Hub — Next-Gen AI Generation Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            950: '#06070B',
                            900: '#0C0E14',
                            800: '#151821',
                            700: '#222736',
                            accent: '#6366f1',
                            cyan: '#06b6d4',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #06070B;
            overflow-x: hidden;
        }

        /* Canvas Arka Plan */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Studio Cards */
        .studio-card {
            background: rgba(18, 21, 31, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .studio-card-interactive {
            background: rgba(12, 14, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .studio-card-interactive:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25);
        }

        /* Glow Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Marquee Scroll */
        .marquee {
            display: flex;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }

        .marquee-content {
            display: flex;
            gap: 1.5rem;
            animation: scroll 30s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans flex flex-col justify-between relative selection:bg-indigo-500 selection:text-white">

    <!-- Uzay & Dönen/Süzülen Token Arka Planı -->
    <canvas id="space-canvas"></canvas>

    <!-- Toast Bildirim Kabuğu -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3"></div>

    <!-- Header Navigation Bar -->
    <header class="studio-card sticky top-0 z-40 px-6 py-4 flex justify-between items-center border-b border-slate-800/60">
        <div class="flex items-center gap-3 cursor-pointer" onclick="showLanding()">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-sparkles text-white text-base"></i>
            </div>
            <span class="text-lg font-bold tracking-wider text-white">AI CREDIT <span class="text-indigo-400 font-normal">HUB</span></span>
        </div>

        <div id="user-header-info" class="hidden items-center gap-4">
            <div class="bg-studio-900 border border-slate-800 px-4 py-2 rounded-xl text-xs font-mono">
                <span class="text-slate-400">Bakiye:</span> 
                <span id="user-balance" class="font-bold text-emerald-400 ml-1">0.00 TL</span>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-rose-400 text-xs transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Çıkış
            </button>
        </div>
    </header>

    <!-- ==================== LANDING PAGE (SORA/SEEDANCE STYLE) ==================== -->
    <main id="landing-page" class="container mx-auto px-4 py-8 max-w-5xl flex-1 flex flex-col justify-center relative z-10">
        
        <!-- Hero Title -->
        <div class="text-center space-y-3 mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full studio-card border border-indigo-500/30 text-indigo-300 text-xs font-medium tracking-wide">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sınırsız AI Üretim Gücü — API Entegrasyonlu
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-gradient leading-tight">
                Hayallerini AI ile Üret,<br class="hidden md:block"/> Yüksek Maliyetlere Takılma.
            </h1>
            <p class="text-slate-400 text-xs md:text-sm max-w-xl mx-auto leading-relaxed">
                Sora, Runway, Midjourney, Suno ve ChatGPT-4o için ayl
